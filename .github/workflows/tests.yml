name: tests

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A superseded push cancels the run it superseded: the macos-15
# pool caps at 5 concurrent jobs and a full lane may take 180 minutes, so a stale
# run holds a slot every other PR is queued behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify.sh
