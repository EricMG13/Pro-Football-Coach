name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Not scripts/verify.sh: its full lane passes --scratch-path, and swift run then hands the
      # SimTests process a CommandLine.arguments[0] that resolves against the CI job's cwd instead
      # of the scratch path — the five tests that re-exec themselves (e.g. CollegeStateTests'
      # "eligibility construction rejects counters outside their supported bounds") fail looking for
      # a binary at a path that doesn't exist. Default scratch path avoids it; reproduces locally too.
      - run: swift build -c release
      - run: swift run -c release SimTests
