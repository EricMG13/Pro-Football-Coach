<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polished selected-logo pass</title>
<style>
  :root { color-scheme: dark; font-family: "Avenir Next", Avenir, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 30px; background: #10131b; color: #f3f1ea; }
  header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
  h1 { margin: 0; font: 700 30px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  header p { margin: 0; color: #aeb5c4; font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  article { overflow: hidden; border: 1px solid #383f52; border-radius: 10px; background: #191e2a; }
  h2 { min-height: 62px; margin: 0; padding: 14px 14px 10px; font-size: 14px; line-height: 1.3; }
  .proof { display: grid; grid-template-columns: 1fr 1fr; }
  .surface { display: grid; min-height: 176px; place-items: center; }
  .surface.light { background: #f5f2e9; }
  .surface.dark { background: #07111f; }
  .surface img { width: 112px; height: 112px; object-fit: contain; }
  .compact { display: flex; align-items: center; justify-content: space-between; min-height: 78px; padding: 9px 16px; border-top: 1px solid #383f52; }
  .compact span { color: #aeb5c4; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .compact img { width: 60px; height: 60px; object-fit: contain; }
</style>
<header>
  <h1>Polished logo pass</h1>
  <p>Light / dark surfaces · compact 60 px proof</p>
</header>
<main>
  <article>
    <h2>Halifax Maritime<br>Tidal Palisades</h2>
    <div class="proof"><div class="surface light"><img src="halifax-maritime-tidal-palisades.png" alt=""></div><div class="surface dark"><img src="halifax-maritime-tidal-palisades.png" alt=""></div></div>
    <div class="compact"><span>Compact</span><img src="halifax-maritime-tidal-palisades.png" alt=""></div>
  </article>
  <article>
    <h2>Waurika Central<br>Hearth Smelters</h2>
    <div class="proof"><div class="surface light"><img src="waurika-central-hearth-smelters.png" alt=""></div><div class="surface dark"><img src="waurika-central-hearth-smelters.png" alt=""></div></div>
    <div class="compact"><span>Compact</span><img src="waurika-central-hearth-smelters.png" alt=""></div>
  </article>
  <article>
    <h2>Gallipolis Central<br>Tidal Quarrymen</h2>
    <div class="proof"><div class="surface light"><img src="gallipolis-central-tidal-quarrymen.png" alt=""></div><div class="surface dark"><img src="gallipolis-central-tidal-quarrymen.png" alt=""></div></div>
    <div class="compact"><span>Compact</span><img src="gallipolis-central-tidal-quarrymen.png" alt=""></div>
  </article>
  <article>
    <h2>Savanna<br>Frost Anchors</h2>
    <div class="proof"><div class="surface light"><img src="savanna-frost-anchors.png" alt=""></div><div class="surface dark"><img src="savanna-frost-anchors.png" alt=""></div></div>
    <div class="compact"><span>Compact</span><img src="savanna-frost-anchors.png" alt=""></div>
  </article>
  <article>
    <h2>Zumbrota Central<br>Marsh Lodestars</h2>
    <div class="proof"><div class="surface light"><img src="zumbrota-central-marsh-lodestars.png" alt=""></div><div class="surface dark"><img src="zumbrota-central-marsh-lodestars.png" alt=""></div></div>
    <div class="compact"><span>Compact</span><img src="zumbrota-central-marsh-lodestars.png" alt=""></div>
  </article>
</main>
