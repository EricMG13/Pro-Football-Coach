name: ProFootballCoach
options:
  bundleIdPrefix: com.ericmg
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
packages:
  ProFootballCoach:
    path: ..
targets:
  ProFootballCoach:
    type: application
    platform: iOS
    sources: [.]
    dependencies:
      - package: ProFootballCoach
        product: FootballSimCore
      - package: ProFootballCoach
        product: ProFootballCoachUI
      - package: ProFootballCoach
        product: CoachWorldApp
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Landscape only, both ways up. Owner decision 2026-08-10 (04 section 5.2): landscape is
        # what fits the whole 120-yard field in frame at once with no camera pan. The audit's
        # orientation findings all traced back to this one line being absent, not to which
        # orientation it named - every screen was rotatable and two of them lost their controls
        # off the bottom edge when they were. One declared orientation is the property that
        # matters. OrientationPolicyTest reads this file, so it cannot drift from 04.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Pro Football Coach"
        # The icon set exists and is empty: its Contents.json declares the single 1024 slot iOS
        # wants and no artwork fills it yet. That is a build warning and an App Store validation
        # failure at submission — both of which are better than the previous state, where there was
        # no asset catalog at all and nothing said the icon was missing.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  ProFootballCoach:
    build:
      targets:
        ProFootballCoach: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
