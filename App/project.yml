name: ProFootballCoach
options:
  bundleIdPrefix: com.ericmg
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  ProFootballCoach:
    path: ..
targets:
  ProFootballCoach:
    type: application
    platform: iOS
    sources: [.]
    dependencies:
      - package: ProFootballCoach
        product: FootballSimCore
      - package: ProFootballCoach
        product: ProFootballCoachUI
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only. The audit's landscape findings all traced back to this one line: every
        # screen was rotatable and two of them lost their controls off the bottom edge when they
        # were. The arcade mode was the reason landscape was declared, and its all-22 field is
        # now a vertical, one-thumb surface — so nothing in the app wants the other orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Pro Football Coach"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  ProFootballCoach:
    build:
      targets:
        ProFootballCoach: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
